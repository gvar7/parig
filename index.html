<!DOCTYPE html>
<html lang="hyw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3a7ea2">
  <meta name="description" content="Parig - Պարիգ: Արեւմտահայերէն բառ գուշակելու խաղ (Wordle)">
  <title>Parig - Պարիգ</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.svg">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Parig - Պարիգ">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">

  <!-- Letter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@700&display=swap">

  <!-- Styles -->
  <style>
    :root {
      --correct: #538d43;
      --present: #b59f33;
      --absent: #3a3a3c;
      --key-bg: #3a3a3c;
      --key-text: #ffffff;
      --main-color: #3a7ea2;
      --main-dark: #2d5b6e;
      --gray1: #818384;
      --gray2: #777575;
      --gray3: #606060;
      --gray4: #3a3a3c;
      --gray5: #f9f8f8;
      --gray6: #e3e2e1;
      --white: #ffffff;
      --black: #000000;
      --letter-font: "Noto Sans Armenian", "Arial Unicode MS", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: var(--gray5);
      margin: 0;
      padding: 0;
    }

    .header {
      position: relative;
      border-bottom: 1px solid #d3d5da;
      padding: 1rem 3.5rem;
      width: 100%;
      text-align: center;
    }

    .icon-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 2.75rem;
      height: 2.75rem;
      border: none;
      border-radius: 50%;
      background-color: var(--main-color);
      color: var(--white);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: background-color 0.15s, opacity 0.15s, transform 0.15s;
    }

    .icon-btn svg {
      width: 1.4rem;
      height: 1.4rem;
      fill: currentColor;
    }

    .icon-btn:hover:not(:disabled) {
      background-color: var(--main-dark);
    }

    .icon-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .icon-btn.ready {
      animation: pulse 0.6s ease-in-out 2;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    #toast {
      position: fixed;
      top: 5.5rem;
      left: 50%;
      transform: translateX(-50%);
      background-color: var(--black);
      color: var(--white);
      padding: 0.6rem 1.1rem;
      border-radius: 6px;
      font-weight: bold;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 10000;
    }

    #toast.show {
      opacity: 1;
    }

    h1 {
      margin: 0;
      font-size: 2.5rem;
      color: var(--black);
    }

    .subtitle {
      margin-top: 0.25rem;
      font-size: 1rem;
      color: var(--gray3);
    }

    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem 0;
    }

    #message-container {
      height: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .message {
      font-size: 1.25rem;
      font-weight: bold;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      text-align: center;
    }

    #message-correct {
      background-color: var(--correct);
      color: white;
    }

    #message-present {
      background-color: var(--present);
      color: white;
    }

    #message-absent {
      background-color: var(--absent);
      color: white;
    }

    .board-container {
      display: grid;
      gap: 0.4rem;
      padding: 0.5rem;
      background-color: var(--black);
      border-radius: 4px;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(5, 3.5rem);
      grid-auto-rows: 3.5rem;
      gap: 0.4rem;
    }

    .tile {
      background-color: var(--white);
      border-radius: 0.3rem;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: var(--letter-font);
      font-size: 1.75rem;
      font-weight: 700;
      text-transform: uppercase;
      transition: transform 0.1s;
      user-select: none;
    }

    .tile[data-state="active"] {
      background-color: var(--gray6);
    }

    .tile[data-state="correct"] {
      background-color: var(--correct);
      color: white;
    }

    .tile[data-state="present"] {
      background-color: var(--present);
      color: white;
    }

    .tile[data-state="absent"] {
      background-color: var(--gray4);
      color: white;
    }

    .tile[data-state="correct"].pop {
      animation: pop 0.1s;
    }

    .tile[data-state="present"].pop {
      animation: pop 0.1s;
    }

    .tile[data-state="absent"].pop {
      animation: pop 0.1s;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .keyboard-container {
      margin-top: 1rem;
    }

    .keyboard-row {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 0.25rem;
    }

    .key {
      background-color: var(--gray4);
      color: var(--white);
      border-radius: 0.3rem;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: var(--letter-font);
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      height: 3rem;
      min-width: 2.5rem;
      padding: 0 0.5rem;
      user-select: none;
      transition: background-color 0.1s;
    }

    .key[data-state="correct"] {
      background-color: var(--correct);
    }

    .key[data-state="present"] {
      background-color: var(--present);
    }

    .key[data-state="absent"] {
      background-color: var(--gray3);
    }

    .key.wide {
      min-width: 4rem;
      font-size: 0.8rem;
    }

    #restart-btn {
      margin-top: 1rem;
      padding: 0.75rem 2rem;
      font-size: 1.25rem;
      background-color: var(--main-color);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    #restart-btn:hover {
      background-color: var(--main-dark);
    }

    .footer {
      margin-top: auto;
      padding: 1rem;
      text-align: center;
      color: var(--gray3);
      font-size: 0.875rem;
    }

    /* Animations */
    @keyframes flipIn {
      0% { transform: rotateX(90deg); opacity: 0; }
      100% { transform: rotateX(0deg); opacity: 1; }
    }

    .tile[data-state="active"] {
      animation: flipIn 0.25s ease-in-out;
    }

    @keyframes flipCorrect {
      0% { background-color: var(--correct); transform: scale(1.1); }
      50% { background-color: var(--gray6); }
      100% { background-color: var(--correct); transform: scale(1); }
    }

    .tile[data-state="correct"].flip {
      animation: flipCorrect 0.7s;
    }

    @keyframes flipPresent {
      0% { background-color: var(--present); transform: scale(1.1); }
      50% { background-color: var(--gray6); }
      100% { background-color: var(--present); transform: scale(1); }
    }

    .tile[data-state="present"].flip {
      animation: flipPresent 0.7s;
    }

    @keyframes flipAbsent {
      0% { background-color: var(--gray3); transform: scale(1.1); }
      50% { background-color: var(--gray6); }
      100% { background-color: var(--gray3); transform: scale(1); }
    }

    .tile[data-state="absent"].flip {
      animation: flipAbsent 0.7s;
    }

    /* Responsive */
    @media (max-width: 500px) {
      h1 { font-size: 2rem; }
      .subtitle { display: none; }
      .header { padding: 1rem 3rem; }
      .icon-btn {
        top: 0.85rem;
        right: 0.75rem;
        width: 2.4rem;
        height: 2.4rem;
      }
      .row {
        grid-template-columns: repeat(5, 3rem);
        grid-auto-rows: 3rem;
      }
      .tile { font-size: 1.5rem; }
      .keyboard-row { gap: 0.25rem; }
      .key {
        min-width: 1.9rem;
        padding: 0 0.3rem;
        font-size: 0.9rem;
      }
      .key.wide {
        min-width: 2.6rem;
        font-size: 0.65rem;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Parig - Պարիգ</h1>
    <p class="subtitle">Արեւմտահայերէն բառ գուշակելու խաղ (Wordle)</p>
    <button id="share-btn" class="icon-btn" type="button" aria-label="Կիսուիլ" title="Կիսուիլ" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
    </button>
  </div>

  <div id="message-container"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <div class="game-container">
    <div class="board-container" id="board"></div>
    
    <div class="keyboard-container" id="keyboard"></div>
    
    <button id="restart-btn">Նոր խաղ</button>
  </div>

  <div class="footer">
    <p>Պարիգ՝ 6 փորձ, 5 տառով բառ մը գտնելու համար: «ու»ն կը հաշուի երկու տառ՝ Ո + Ւ</p>
  </div>

  <script src="app.js"></script>
  
  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(registration => {
            console.log('ServiceWorker registered:', registration);
          })
          .catch(error => {
            console.log('ServiceWorker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
