<!DOCTYPE html>
<html lang="hyw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#3a7ea2">
  <meta name="description" content="Parig - Պարիգ: Արեւմտահայերէն բառ գուշակելու խաղ (Wordle)">
  <title>Parig - Պարիգ</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.svg">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Parig - Պարիգ">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">

  <!-- Font (Noto Sans Armenian — purpose-built for the Armenian script) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;500;700&display=swap">

  <!-- Styles -->
  <style>
    :root {
      --correct: #538d43;
      --present: #b59f33;
      --absent: #3a3a3c;
      --key-bg: #3a3a3c;
      --key-text: #ffffff;
      --main-color: #3a7ea2;
      --main-dark: #2d5b6e;
      --gray1: #818384;
      --gray2: #777575;
      --gray3: #606060;
      --gray4: #3a3a3c;
      --gray5: #f9f8f8;
      --gray6: #e3e2e1;
      --white: #ffffff;
      --black: #000000;
      --font: "Noto Sans Armenian", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

      /* Vertical space used by everything except the board tiles
         (header, message, keyboard, hint, paddings, board gaps) */
      --chrome: 23.5rem;
      --gap: 0.35rem;
      --tile-max: 3.75rem;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);

      /* Tiles are as large as both the screen width and height allow,
         so the whole game fits on a phone screen without scrolling */
      --tile: clamp(
        1.75rem,
        min(
          calc((100vw - 2rem) / 5 - var(--gap)),
          calc((100vh - var(--chrome) - var(--safe-top) - var(--safe-bottom)) / 6)
        ),
        var(--tile-max)
      );
    }

    @supports (height: 100dvh) {
      :root {
        --tile: clamp(
          1.75rem,
          min(
            calc((100vw - 2rem) / 5 - var(--gap)),
            calc((100dvh - var(--chrome) - var(--safe-top) - var(--safe-bottom)) / 6)
          ),
          var(--tile-max)
        );
      }
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: var(--font);
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: var(--gray5);
      margin: 0;
      padding: 0;
      overflow-y: auto;
      -webkit-tap-highlight-color: transparent;
    }

    @supports (height: 100dvh) {
      body {
        height: 100dvh;
      }
    }

    .header {
      position: relative;
      flex: none;
      border-bottom: 1px solid #d3d5da;
      padding: calc(0.6rem + var(--safe-top)) 3.5rem 0.6rem;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 1.9rem;
      font-weight: 700;
      color: var(--black);
      letter-spacing: 0.02em;
      text-transform: lowercase;
    }

    .subtitle {
      margin: 0.15rem 0 0;
      font-size: 0.9rem;
      color: var(--gray3);
      text-transform: lowercase;
    }

    .icon-btn {
      position: absolute;
      top: calc(0.6rem + var(--safe-top));
      width: 2.6rem;
      height: 2.6rem;
      border: none;
      border-radius: 50%;
      background-color: var(--main-color);
      color: var(--white);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: background-color 0.15s, opacity 0.15s, transform 0.15s;
    }

    .icon-btn.left {
      left: 0.75rem;
    }

    .icon-btn.right {
      right: 0.75rem;
    }

    .icon-btn svg {
      width: 1.35rem;
      height: 1.35rem;
      fill: currentColor;
    }

    .icon-btn:hover {
      background-color: var(--main-dark);
    }

    .icon-btn.dim {
      opacity: 0.4;
    }

    .icon-btn.ready {
      animation: pulse 0.6s ease-in-out 2;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .game {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 0.25rem 0.25rem calc(0.5rem + var(--safe-bottom));
    }

    #message-container {
      height: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .message {
      font-size: 1.1rem;
      font-weight: 700;
      padding: 0.3rem 0.9rem;
      border-radius: 4px;
      text-align: center;
      white-space: nowrap;
      text-transform: lowercase;
    }

    #message-correct {
      background-color: var(--correct);
      color: white;
    }

    #message-present {
      background-color: var(--present);
      color: white;
    }

    #message-absent {
      background-color: var(--absent);
      color: white;
    }

    .board-container {
      display: grid;
      gap: var(--gap);
      padding: var(--gap);
      background-color: var(--black);
      border-radius: 4px;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(5, var(--tile));
      grid-auto-rows: var(--tile);
      gap: var(--gap);
    }

    .tile {
      background-color: var(--white);
      border-radius: 0.3rem;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: calc(var(--tile) * 0.5);
      font-weight: 700;
      text-transform: uppercase;
      transition: transform 0.1s;
      user-select: none;
    }

    .tile[data-state="active"] {
      background-color: var(--gray6);
    }

    .tile[data-state="correct"] {
      background-color: var(--correct);
      color: white;
    }

    .tile[data-state="present"] {
      background-color: var(--present);
      color: white;
    }

    .tile[data-state="absent"] {
      background-color: var(--gray4);
      color: white;
    }

    .keyboard-container {
      width: 100%;
      max-width: 32rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .keyboard-row {
      display: flex;
      justify-content: center;
      gap: 0.25rem;
    }

    /* Unused letters are light; once a letter has been played the key turns
       green, yellow or dark gray, so it is obvious which letters are used. */
    .key {
      flex: 1 1 0;
      min-width: 0;
      max-width: 2.75rem;
      height: 2.75rem;
      background-color: #d3d6da;
      color: #1a1a1b;
      border-radius: 0.3rem;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 700;
      font-size: 1.05rem;
      text-transform: lowercase; /* display only — the key still types its uppercase letter */
      cursor: pointer;
      user-select: none;
      transition: background-color 0.15s, color 0.15s, opacity 0.15s;
    }

    .key[data-state="correct"] {
      background-color: var(--correct);
      color: var(--white);
    }

    .key[data-state="present"] {
      background-color: var(--present);
      color: var(--white);
    }

    .key[data-state="absent"] {
      background-color: var(--gray4);
      color: #8a8a8c;
    }

    .key.wide {
      flex: 1.6 1 0;
      max-width: 4.2rem;
      font-size: 0.7rem;
    }

    /* ENTER is dimmed until the row holds a valid 5-letter word */
    .key.disabled {
      background-color: #e6e8ea;
      color: #a8adb2;
      cursor: default;
    }

    /* Invalid guess feedback */
    .row.shake {
      animation: shake 0.45s;
    }

    @keyframes shake {
      10%, 90% { transform: translateX(-2px); }
      20%, 80% { transform: translateX(4px); }
      30%, 50%, 70% { transform: translateX(-6px); }
      40%, 60% { transform: translateX(6px); }
    }

    .tile.invalid {
      background-color: #f6dcdc;
      color: #b3261e;
      box-shadow: inset 0 0 0 2px #d9534f;
    }

    #message-error {
      background-color: #c0392b;
      color: white;
    }

    .hint {
      margin: 0;
      font-size: 0.75rem;
      color: var(--gray3);
      text-align: center;
      text-transform: lowercase;
    }

    #toast {
      position: fixed;
      top: calc(4.5rem + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      background-color: var(--black);
      color: var(--white);
      padding: 0.6rem 1.1rem;
      border-radius: 6px;
      font-weight: 700;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 10000;
      text-transform: lowercase;
    }

    #toast.show {
      opacity: 1;
    }

    /* Animations */
    @keyframes flipIn {
      0% { transform: rotateX(90deg); opacity: 0; }
      100% { transform: rotateX(0deg); opacity: 1; }
    }

    .tile[data-state="active"] {
      animation: flipIn 0.25s ease-in-out;
    }

    @keyframes flipCorrect {
      0% { background-color: var(--correct); transform: scale(1.1); }
      50% { background-color: var(--gray6); }
      100% { background-color: var(--correct); transform: scale(1); }
    }

    .tile[data-state="correct"].flip {
      animation: flipCorrect 0.7s;
    }

    @keyframes flipPresent {
      0% { background-color: var(--present); transform: scale(1.1); }
      50% { background-color: var(--gray6); }
      100% { background-color: var(--present); transform: scale(1); }
    }

    .tile[data-state="present"].flip {
      animation: flipPresent 0.7s;
    }

    @keyframes flipAbsent {
      0% { background-color: var(--gray3); transform: scale(1.1); }
      50% { background-color: var(--gray6); }
      100% { background-color: var(--gray3); transform: scale(1); }
    }

    .tile[data-state="absent"].flip {
      animation: flipAbsent 0.7s;
    }

    /* Larger screens */
    @media (min-width: 501px) {
      :root {
        --chrome: 27rem;
      }

      .header {
        padding-top: calc(0.9rem + var(--safe-top));
        padding-bottom: 0.9rem;
      }

      h1 {
        font-size: 2.4rem;
      }

      .icon-btn {
        top: calc(1rem + var(--safe-top));
        width: 2.75rem;
        height: 2.75rem;
      }

      .icon-btn.left {
        left: 1rem;
      }

      .icon-btn.right {
        right: 1rem;
      }

      .key {
        height: 3.25rem;
      }

      .game {
        padding: 0.75rem 1rem calc(1rem + var(--safe-bottom));
      }

      #toast {
        top: calc(6.25rem + var(--safe-top));
      }
    }

    /* Phones */
    @media (max-width: 500px) {
      .subtitle {
        display: none;
      }
    }

    /* Very short screens: drop the hint line */
    @media (max-height: 640px) {
      .hint {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <button id="restart-btn" class="icon-btn left" type="button" aria-label="Նոր խաղ" title="Նոր խաղ">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
    <h1>Parig - Պարիգ</h1>
    <p class="subtitle">Արեւմտահայերէն բառ գուշակելու խաղ (Wordle)</p>
    <button id="share-btn" class="icon-btn right dim" type="button" aria-label="Կիսուիլ" title="Կիսուիլ">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
    </button>
  </header>

  <main class="game">
    <div id="message-container"></div>

    <div class="board-container" id="board"></div>

    <div class="keyboard-container" id="keyboard"></div>

    <p class="hint">6 փորձ, 5 տառով բառ մը գտնելու համար: «ու»ն կը հաշուի երկու տառ՝ Ո + Ւ</p>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      // When a new version of the service worker takes over, reload once so
      // the page that is showing is the new one too (not on the very first install).
      const hadController = !!navigator.serviceWorker.controller;
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!hadController || refreshing) return;
        refreshing = true;
        window.location.reload();
      });

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(registration => {
            console.log('ServiceWorker registered:', registration.scope);
          })
          .catch(error => {
            console.log('ServiceWorker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
